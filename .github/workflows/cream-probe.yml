name: Cream Traffic Probe -> Gist traffic.txt
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read current sub URL from cream Gist
        id: suburl
        run: |
          URL=$(curl -sL --max-time 20 "https://gist.githubusercontent.com/maxiangyu421/89d7a13233112ddcd32863189ef2e8e4/raw/latest_sub_url.txt")
          echo "SUB_URL=$URL" >> $GITHUB_OUTPUT
      - name: Probe subscription-userinfo header
        id: probe
        run: |
          URL="${{ steps.suburl.outputs.SUB_URL }}"
          HDRS=$(curl -s -D - -o /tmp/sub_body.txt --max-time 25 -A "ClashMeta/1.0" "$URL")
          echo "$HDRS" > /tmp/sub_hdr.txt
          SUBLINE=$(grep -i "^subscription-userinfo" /tmp/sub_hdr.txt | head -1)
          if [ -z "$SUBLINE" ]; then
            echo "NO_SUBSCRIPTION_INFO=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          DL=$(echo "$SUBLINE" | grep -oE "download=[0-9]+" | grep -oE "[0-9]+")
          TOTAL=$(echo "$SUBLINE" | grep -oE "total=[0-9]+" | grep -oE "[0-9]+")
          EXPIRE=$(echo "$SUBLINE" | grep -oE "expire=[0-9]+" | grep -oE "[0-9]+")
          echo "DL=$DL" >> $GITHUB_OUTPUT
          echo "TOTAL=$TOTAL" >> $GITHUB_OUTPUT
          echo "EXPIRE=$EXPIRE" >> $GITHUB_OUTPUT
      - name: Write traffic.txt to cream Gist
        if: steps.probe.outputs.DL != ''
        env:
          GHTOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          DL="${{ steps.probe.outputs.DL }}"
          TOTAL="${{ steps.probe.outputs.TOTAL }}"
          EXPIRE="${{ steps.probe.outputs.EXPIRE }}"
          NOW=$(date +%s)
          printf 'ts=%s download=%s total=%s expire=%s\n' "$NOW" "$DL" "$TOTAL" "$EXPIRE" > /tmp/traffic.txt
          curl -sS --max-time 25 -X PATCH "https://api.github.com/gists/89d7a13233112ddcd32863189ef2e8e4" \
            -H "Authorization: token $GHTOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"files\":{\"traffic.txt\":{\"content\":\"$(cat /tmp/traffic.txt)\"}}}"

